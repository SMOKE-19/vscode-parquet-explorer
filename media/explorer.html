<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src __CSP_SOURCE__; script-src 'nonce-__NONCE__';">
  <link rel="stylesheet" href="__STYLE_URI__">
  <title>PQ Explorer</title>
</head>
<body>
  <header>
    <h1>PQ Explorer</h1>
    <p>DuckDB · 읽기 전용</p>
  </header>
  <main>
    <div class="source-row">
      <input id="source" aria-label="Parquet 경로" placeholder="Parquet 파일 또는 dataset 폴더 경로">
      <button id="open-source">소스 열기</button>
    </div>
    <div id="meta" class="meta">DuckDB 작업자를 시작하는 중입니다…</div>
    <label for="sql">SQL</label>
    <textarea id="sql" spellcheck="false">SELECT * FROM data</textarea>
    <div class="toolbar">
      <button id="run" class="primary">실행 <small>Ctrl+Enter</small></button>
      <button id="lint">SQL 검사</button>
      <label>행 <select id="page-size"><option>25</option><option selected>50</option><option>100</option><option>200</option></select></label>
      <span id="status" role="status"></span>
    </div>
    <div id="table-wrap" class="table-wrap"><div class="empty">결과를 기다리는 중입니다…</div></div>
    <footer>
      <div><button id="previous-columns">← 이전 칼럼</button><span id="column-range">—</span><button id="next-columns">다음 칼럼 →</button></div>
      <div><button id="previous-page">↑ 이전 행</button><span id="row-range">—</span><button id="next-page">다음 행 ↓</button></div>
    </footer>
  </main>
  <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>
</html>
