<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src __CSP_SOURCE__ 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';">
  <link rel="stylesheet" href="__STYLE_URI__">
  <title>PQ Explorer</title>
</head>
<body>
  <header>
    <h1>PQ Explorer</h1>
  </header>
  <main>
    <div class="source-row">
      <input id="source" aria-label="Parquet 경로" placeholder="Parquet 파일 또는 dataset 폴더 경로">
      <button id="open-source">소스 열기</button>
    </div>
    <div id="meta" class="meta">DuckDB 작업자를 시작하는 중입니다…</div>
    <div class="sql-heading">
      <label for="sql-editor">SQL</label>
      <div class="sql-actions">
        <button id="lint">SQL 검사</button>
        <button id="save-favorite">SQL 저장</button>
        <button id="pick-favorite">즐겨찾기</button>
      </div>
    </div>
    <div id="sql-editor" aria-label="SQL 편집기"></div>
    <div class="toolbar">
      <button id="run" class="primary">실행 <small>Ctrl+Enter</small></button>
      <span id="status" role="status"></span>
    </div>
    <div id="table-wrap" class="table-wrap"><div class="empty">결과를 기다리는 중입니다…</div></div>
    <footer class="table-navigation">
      <div class="nav-group">
        <span>칼럼</span>
        <button id="previous-columns" aria-label="이전 칼럼" title="이전 칼럼">←</button>
        <input id="column-position" type="number" min="1" aria-label="마지막 칼럼 번호" title="이동할 칼럼 번호를 입력하세요" disabled>
        <span class="nav-total">/ <span id="column-total">—</span></span>
        <button id="next-columns" aria-label="다음 칼럼" title="다음 칼럼">→</button>
        <label>표시 <select id="column-limit"><option>5</option><option>10</option><option selected>20</option><option>40</option><option>100</option></select></label>
      </div>
      <div class="nav-group">
        <span>행</span>
        <button id="previous-page" aria-label="이전 행" title="이전 행">↑</button>
        <input id="row-position" type="number" min="1" aria-label="마지막 행 번호" title="이동할 행 번호를 입력하세요" disabled>
        <span class="nav-total">/ <span id="row-total">—</span></span>
        <button id="next-page" aria-label="다음 행" title="다음 행">↓</button>
        <label>표시 <select id="page-size"><option>25</option><option selected>50</option><option>100</option><option>200</option></select></label>
      </div>
    </footer>
  </main>
  <section id="favorites-dialog" class="favorites-dialog" role="dialog" aria-modal="true" aria-labelledby="favorites-title" hidden>
    <div class="favorites-card">
      <div class="favorites-heading"><h2 id="favorites-title">SQL 즐겨찾기</h2><button id="favorites-close" type="button" aria-label="즐겨찾기 닫기">✕</button></div>
      <div class="favorites-path"><span>백업 폴더</span><code id="favorites-path"></code><button id="favorites-copy" type="button">경로 복사</button></div>
      <div class="favorites-controls"><input id="favorites-search" type="search" aria-label="즐겨찾기 검색" placeholder="별칭, 설명, SQL 검색"><label>정렬 <select id="favorites-sort"><option value="frequent">자주 사용</option><option value="used">최근 사용</option><option value="updated">최근 수정</option><option value="alias">별칭</option></select></label></div>
      <div id="favorites-error" class="favorites-error" role="status"></div>
      <div id="favorites-list" class="favorites-list" role="list"></div>
    </div>
  </section>
  <script nonce="__NONCE__" src="__SQL_EDITOR_URI__"></script>
  <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>
</html>
